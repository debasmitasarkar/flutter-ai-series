name: isolate_json_parsing
description: 'Code for the article Parsing Big AI JSON in Flutter - When Isolate.run Helps and When It Is Just Overhead.'
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# From the article: json_serializable 6.14.1 + source_helper 1.4.0 failed with
# "defined in multiple extensions"; pinning source_helper fixed it.
dependency_overrides:
  source_helper: ">=1.3.5 <1.4.0"

flutter:
  uses-material-design: true
