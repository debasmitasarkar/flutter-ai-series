name: material_ui_migration
description: "A Flutter 3.38 app migrated to material_ui and cupertino_ui on Flutter 3.50.0."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  google_fonts: ^9.0.0
  intl: ^0.20.2

  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
