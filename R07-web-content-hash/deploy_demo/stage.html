<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f172a;font-family:-apple-system,Helvetica,sans-serif;color:#e2e8f0;width:1000px;height:560px;overflow:hidden}
#cap{height:64px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:.2px}
#cap code{font-family:'JetBrains Mono',Menlo,monospace;background:#1e293b;padding:4px 10px;border-radius:8px;color:#fbbf24}
.row{display:flex;gap:24px;padding:0 24px}
.pane{flex:1}
.lbl{font-size:17px;font-weight:600;margin:0 0 8px 2px}
.lbl small{display:block;font-weight:400;color:#94a3b8;font-size:14px;margin-top:2px;font-family:Menlo,monospace}
iframe{width:464px;height:300px;border:0;border-radius:12px;display:block;background:#fff}
.net{margin-top:10px;font-family:Menlo,monospace;font-size:13px;color:#94a3b8;min-height:60px;line-height:1.5}
.net b{color:#e2e8f0;font-weight:600}
</style></head><body>
<div id="cap">Build 1 is live</div>
<div class="row">
 <div class="pane"><div class="lbl">Plain <code>flutter build web</code><small>main.dart.js · max-age=86400</small></div><iframe id="a" src="http://127.0.0.1:8081/"></iframe><div class="net" id="na"></div></div>
 <div class="pane"><div class="lbl"><code>--web-content-hash</code><small>main.dart.&lt;hash&gt;.js · immutable</small></div><iframe id="b" src="http://127.0.0.1:8082/"></iframe><div class="net" id="nb"></div></div>
</div></body></html>
